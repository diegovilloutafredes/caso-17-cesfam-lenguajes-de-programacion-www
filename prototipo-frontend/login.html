<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CESFAM</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="login-shell">
  <section class="login-card">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3z"/></svg>
      </div>
      <div class="brand-text"><strong>CESFAM</strong><small>Sistema de Salud</small></div>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Sistema de Salud — Centro de Atención Primaria</p>

    <form onsubmit="event.preventDefault(); window.location.href='panel-medico.html';">
      <div class="input-group">
        <label for="rut">RUT</label>
        <input id="rut" class="input" type="text" placeholder="Insertar RUT" autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input id="password" class="input" type="password" placeholder="Insertar contraseña" autocomplete="current-password">
      </div>

      <div class="role-btns">
        <button type="submit" class="btn btn-primary">Ingresar como Médico</button>
        <button type="button" class="btn btn-outline"
                onclick="window.location.href='panel-farmacia.html'">Ingresar como Funcionario</button>
      </div>
    </form>

    <footer>© 2026 CESFAM — Sistema de Salud</footer>
  </section>
</main>
</body>
</html>
