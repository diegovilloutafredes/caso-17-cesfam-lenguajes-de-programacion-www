services:
  postgres:
    image: postgres:16
    container_name: cesfam_pg
    environment:
      POSTGRES_USER: cesfam
      POSTGRES_PASSWORD: cesfam
      POSTGRES_DB: cesfam
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesfam"]
      interval: 3s
      timeout: 3s
      retries: 20

  identity_service:
    build: .
    container_name: cesfam_identity
    ports:
      - "8001:8001"
    command: uvicorn identity_service.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+psycopg2://cesfam:cesfam@postgres:5432/identity_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s

  patient_service:
    build: .
    container_name: cesfam_patients
    ports:
      - "8002:8002"
    command: uvicorn patient_service.main:app --host 0.0.0.0 --port 8002
    environment:
      DATABASE_URL: postgresql+psycopg2://cesfam:cesfam@postgres:5432/patient_db
      PRESCRIPTION_SERVICE_URL: http://prescription_service:8004
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s

  inventory_service:
    build: .
    container_name: cesfam_inventory
    ports:
      - "8003:8003"
    command: uvicorn inventory_service.main:app --host 0.0.0.0 --port 8003
    environment:
      DATABASE_URL: postgresql+psycopg2://cesfam:cesfam@postgres:5432/inventory_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s

  notification_service:
    build: .
    container_name: cesfam_notifications
    ports:
      - "8005:8005"
    command: uvicorn notification_service.main:app --host 0.0.0.0 --port 8005
    environment:
      DATABASE_URL: postgresql+psycopg2://cesfam:cesfam@postgres:5432/notification_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s

  prescription_service:
    build: .
    container_name: cesfam_prescriptions
    ports:
      - "8004:8004"
    command: uvicorn prescription_service.main:app --host 0.0.0.0 --port 8004
    environment:
      DATABASE_URL: postgresql+psycopg2://cesfam:cesfam@postgres:5432/prescription_db
      PATIENT_SERVICE_URL: http://patient_service:8002
      INVENTORY_SERVICE_URL: http://inventory_service:8003
      NOTIFICATION_SERVICE_URL: http://notification_service:8005
    depends_on:
      postgres:
        condition: service_healthy
      patient_service:
        condition: service_healthy
      inventory_service:
        condition: service_healthy
      notification_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s

  report_service:
    build: .
    container_name: cesfam_reports
    ports:
      - "8006:8006"
    command: uvicorn report_service.main:app --host 0.0.0.0 --port 8006
    environment:
      INVENTORY_SERVICE_URL: http://inventory_service:8003
      PRESCRIPTION_SERVICE_URL: http://prescription_service:8004
    depends_on:
      inventory_service:
        condition: service_healthy
      prescription_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 8s

  api_gateway:
    build: .
    container_name: cesfam_gateway
    ports:
      - "8000:8000"
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000
    environment:
      IDENTITY_SERVICE_URL: http://identity_service:8001
      PATIENT_SERVICE_URL: http://patient_service:8002
      INVENTORY_SERVICE_URL: http://inventory_service:8003
      PRESCRIPTION_SERVICE_URL: http://prescription_service:8004
      NOTIFICATION_SERVICE_URL: http://notification_service:8005
      REPORT_SERVICE_URL: http://report_service:8006
    depends_on:
      identity_service:
        condition: service_healthy
      patient_service:
        condition: service_healthy
      inventory_service:
        condition: service_healthy
      prescription_service:
        condition: service_healthy
