services:
  auth:
    build: .
    command: uvicorn services.auth.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/backend
    depends_on:
      - db

  patients:
    build: .
    command: uvicorn services.patients.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/backend
    depends_on:
      - db

  medications:
    build: .
    command: uvicorn services.medications.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/backend
    depends_on:
      - db

  prescriptions:
    build: .
    command: uvicorn services.prescriptions.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8004:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/backend
    depends_on:
      - db

  reports:
    build: .
    command: uvicorn services.reports.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8005:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/backend
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: